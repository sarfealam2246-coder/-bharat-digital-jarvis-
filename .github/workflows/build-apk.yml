name: Build Bharat Digital Jarvis APK

on:
  push:
    branches: [ main ]
    paths: [ 'src/**', 'package.json', '*.zip' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP if uploaded
        run: |
          if [ -f "bharat-digital-jarvis-complete.zip" ]; then
            unzip -o bharat-digital-jarvis-complete.zip -x ".github/workflows/*"
            rm -f bharat-digital-jarvis-complete.zip
            git config user.name "Jarvis Build Bot"
            git config user.email "bot@users.noreply.github.com"
            git add .
            git diff --staged --quiet || (git pull --rebase --autostash && git commit -m "chore: extract project files" && git push)
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize & Build Android APK
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bharat-digital-jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
